<div class="container-fluid">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left-info">
      <h2>Run Payroll</h2>
      <p class="text-muted">Select a pay period to calculate and generate payslips for all eligible employees.</p>
    </div>
  </div>

  <div class="card payroll-card">
    <div class="card-body">
      <form [formGroup]="payrollForm" (ngSubmit)="runPayroll()">
        <div class="row">
          <!-- Start Date -->
          <div class="col-md-6">
            <div class="form-group">
              <label for="payPeriodStart" class="form-label">Pay Period Start</label>
              <div class="input-with-icon">
                <span class="material-icons input-icon">date_range</span>
                <input type="date" id="payPeriodStart" class="form-control" formControlName="payPeriodStart">
              </div>
            </div>
          </div>
          
          <!-- End Date -->
          <div class="col-md-6">
            <div class="form-group">
              <label for="payPeriodEnd" class="form-label">Pay Period End</label>
              <div class="input-with-icon">
                <span class="material-icons input-icon">date_range</span>
                <input type="date" id="payPeriodEnd" class="form-control" formControlName="payPeriodEnd">
              </div>
            </div>
          </div>
        </div>

        <!-- Validations -->
        <div *ngIf="payrollForm.invalid && payrollForm.touched" class="alert alert-warning mt-3">
          <div class="d-flex align-items-center gap-2">
            <span class="material-icons" style="font-size: 20px;">info</span>
            <span>Please select both a valid start and end date for the pay period.</span>
          </div>
        </div>

        <!-- Submit Button Footer -->
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary run-button" [disabled]="payrollForm.invalid || loading">
            <span class="material-icons" *ngIf="!loading">play_circle</span>
            <span class="spinner-border" *ngIf="loading"></span>
            <span *ngIf="!loading">Run Payroll Process</span>
            <span *ngIf="loading">Processing Payroll...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
